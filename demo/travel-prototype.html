function mount(i,autoplay=false){const v=variants[i];cancelAnimationFrame(countFrame);cancelAnimationFrame(cameraFrame);clearTimeout(startTimer);stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=`<div class="shell"><article class="phone ${v.cls}"><header class="top"><div class="brand">뭐했<span>지</span></div><div class="top-note">우리의 발자취</div></header><div class="intro"><div class="eyebrow">우리의 발자취</div><h1>${v.title}</h1><p>${v.sub}</p></div>${map}<div class="memory-list" aria-live="polite"><p class="region-empty">지도에서 빛나는 지역을 선택해 주세요.</p></div><section class="details"><div class="details-top"><div><div class="date">첫 번째 장소</div><h2>${v.heading}</h2><p>${v.detail}</p></div><button class="replay" type="button">↻ 다시 보기</button></div><p class="demo-metrics-note">예시 수치 · 실제 경로 계산 아님</p><div class="people" aria-label="예시 이동 거리와 시간">${v.people.split('|').map((label,index)=>`<div class="trip"><span class="trip-label"><i class="dot ${index===0?'a':'b'}"></i>${label} → 서울숲</span><span class="trip-metrics" aria-label="${index===0?'4.2km, 18분':'6.8km, 24분'}"><span data-value="${index===0?4.2:6.8}" data-decimals="1">0.0</span> <small>km</small> · <span data-value="${index===0?18:24}" data-decimals="0">0</span> <small>분</small></span><span class="trip-mode">${index===0?"자동차":"대중교통"} · 예시 수치</span></div>`).join('')}</div></section></article></div>`;const phone=stage.querySelector('.phone');stage.querySelector('.visited-places').innerHTML=Object.entries(regions).map(([key,region])=>`<g class="region-node" role="button" tabindex="0" aria-label="${region.name} 기록 보기" data-region="${key}"><circle cx="${region.x}" cy="${region.y}" r="10" fill="transparent"/><circle class="visited-halo" cx="${region.x}" cy="${region.y}" r="5"/><circle class="visited-dot" cx="${region.x}" cy="${region.y}" r="2.5"/></g>`).join('');const counters=[...stage.querySelectorAll('[data-value]')];function play(){if(!selectedRegion)return;if(phone.classList.contains('is-playing')||phone.classList.contains('is-zooming')){mount(i,true);return}phone.classList.add('is-zooming','is-playing');const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;const mapSvg=stage.querySelector('.journey-map');const cameraStart=performance.now();const cameraDuration=reduced?0:650;const from=mapSvg.getAttribute('viewBox').split(/[ ,]+/).map(Number);const region=regions[selectedRegion];const to=[region.x-30,region.y-30,60,54.42];function moveCamera(now){const progress=cameraDuration?Math.min((now-cameraStart)/cameraDuration,1):1;const eased=1-Math.pow(1-progress,3);mapSvg.setAttribute('viewBox',from.map((value,index)=>value+(to[index]-value)*eased).join(' '));if(progress<1)cameraFrame=requestAnimationFrame(moveCamera)}function startCounters(){const duration=i===1?1400:i===2?1100:900;const start=performance.now();function update(now){const progress=reduced?1:Math.min((now-start)/duration,1);counters.forEach(el=>{el.textContent=(Number(el.dataset.value)*progress).toFixed(Number(el.dataset.decimals))});if(progress<1)countFrame=requestAnimationFrame(update)}countFrame=requestAnimationFrame(update)}cameraFrame=requestAnimationFrame(moveCamera);startCounters();const arrival=stage.querySelector('.arrival-card');arrival.querySelector('strong').textContent=region.place;arrival.querySelector('span').textContent=region.date+' · 첫 번째 장소';setTimeout(()=>{if(phone.isConnected&&phone.classList.contains('is-playing'))(arrival.classList.add('is-visible'),phone.classList.add('has-arrived'))},reduced?0:(i===1?1400:i===2?1100:900));if(!reduced){const tips=stage.querySelectorAll('.sketch-tip');const tipDuration=i===1?700:i===2?1100:900;function runTip(tip){tip.setAttribute('visibility','visible');const motion=tip.querySelector('animateMotion');motion.setAttribute('dur',`${tipDuration}ms`);motion.beginElement();setTimeout(()=>tip.setAttribute('visibility','hidden'),tipDuration)}runTip(tips[0]);if(i===1)startTimer=setTimeout(()=>runTip(tips[1]),700);else runTip(tips[1])}}function applyExampleSelection(){if(!exampleSelection)return;stage.querySelectorAll('.trip-label').forEach((el,index)=>{el.lastChild.textContent=`${index===0?'나':'상대'} · ${exampleSelection[index===0?'homeA':'homeB']}`});stage.querySelectorAll('.trip-mode').forEach((el,index)=>{el.textContent=`${exampleSelection[index===0?'modeA':'modeB']} · 예시 수치`})}function showExampleSetup(){const region=regions[selectedRegion];const list=stage.querySelector('.memory-list');list.innerHTML=`<div class="region-list-head"><p class="region-list-title">이동을 살펴볼까요?</p><button type="button" class="region-close" aria-label="이동 준비 닫기">×</button></div><p class="setup-intro">${region.date} · ${region.name}의 예시 기록</p><form class="journey-setup"><label>첫 번째 장소<select name="destination"><option>${region.place}</option></select></label><div class="setup-row"><label>나의 출발지<select name="homeA"><option>나의 기본 출발지 · 예시</option><option>나의 다른 출발지 · 예시</option></select></label><label>상대방 출발지<select name="homeB"><option>상대방 기본 출발지 · 예시</option><option>상대방 다른 출발지 · 예시</option></select></label></div><div class="setup-row"><label>나의 이동 수단<select name="modeA"><option>자동차</option><option>대중교통</option><option>도보</option></select></label><label>상대방 이동 수단<select name="modeB"><option>대중교통</option><option>자동차</option><option>도보</option></select></label></div><p class="setup-note">화면 흐름을 위한 예시입니다. 출발지와 이동 수단을 바꿔도 경로와 수치는 바뀌지 않아요.</p><button class="setup-submit" type="submit">이동 장면 보기</button></form>`;list.querySelector('.region-close').addEventListener('click',()=>selectRegion(selectedRegion));list.querySelector('.journey-setup').addEventListener('submit',event=>{event.preventDefault();const data=new FormData(event.currentTarget);exampleSelection=Object.fromEntries(data.entries());applyExampleSelection();play()})}function selectRegion(key){if(selectedRegion!==key)exampleSelection=null;selectedRegion=key;phone.classList.add('has-region');const region=regions[key];const iso={seoul:'KR-11',gyeonggi:'KR-41',incheon:'KR-28',cheongju:'KR- function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
